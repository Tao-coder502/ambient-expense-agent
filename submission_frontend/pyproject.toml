# pyproject.toml for the manager dashboard service
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "submission_frontend"
version = "0.1.0"
description = "FastAPI manager dashboard for ambient expense agent"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "google-adk",
    "google-cloud-aiplatform"
]
